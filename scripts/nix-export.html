<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  .wrap{padding:150px;}
  .stage{width:600px;height:600px;position:relative;}
  .glow{position:absolute;inset:-120px;border-radius:50%;background:radial-gradient(circle, rgba(124,58,237,0.45), rgba(6,182,212,0.25) 55%, transparent 72%);filter:blur(6px);}
  .body{position:absolute;inset:0;border-radius:42% 58% 55% 45% / 48% 42% 58% 52%;background:linear-gradient(150deg, #67e8f9 0%, #7C3AED 55%, #7C3AED 100%);box-shadow:0 0 162px rgba(124,58,237,0.55), inset -54px -54px 120px rgba(76,29,149,0.5), inset 42px 42px 96px rgba(255,255,255,0.35);}
  .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;}
  .eyes{display:flex;gap:78px;}
  .eye{width:48px;height:66px;background:#1b0b33;border-radius:50%;}
  .eye.sleep{width:48px;height:11px;border-radius:11px;}
  .mouth{width:90px;height:45px;border-radius:0 0 90px 90px;border:18px solid #1b0b33;border-top:none;box-sizing:border-box;}
  .mouth.small{width:90px;height:45px;border:12px solid #1b0b33;border-top:none;}
  .bubble{position:absolute;top:-48px;right:-30px;width:156px;height:144px;border-radius:48px 48px 48px 12px;background:#FBBF24;color:#3b2a00;font-family:'Fredoka One',cursive;font-size:96px;display:flex;align-items:center;justify-content:center;}
  .spark{position:absolute;border-radius:50%;}
  .spark1{width:36px;height:36px;top:6%;right:8%;background:#FBBF24;}
  .spark2{width:30px;height:30px;top:55%;right:2%;background:#67e8f9;}
</style>
</head>
<body>

  <div class="wrap"><div id="pose-idle" class="stage">
    <div class="glow"></div>
    <div class="body"></div>
    <div class="face">
      <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      <div class="mouth small"></div>
    </div>
    <div class="spark spark1"></div>
    <div class="spark spark2"></div>
  </div></div>

  <div class="wrap"><div id="pose-ask" class="stage">
    <div class="glow"></div>
    <div class="body"></div>
    <div class="face">
      <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      <div class="mouth small"></div>
    </div>
    <div class="bubble">?</div>
    <div class="spark spark1"></div>
    <div class="spark spark2"></div>
  </div></div>

  <div class="wrap"><div id="pose-cheer" class="stage">
    <div class="glow"></div>
    <div class="body"></div>
    <div class="face">
      <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      <div class="mouth"></div>
    </div>
  </div></div>

  <div class="wrap"><div id="pose-think" class="stage">
    <div class="glow"></div>
    <div class="body"></div>
    <div class="face">
      <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
      <div class="mouth small"></div>
    </div>
  </div></div>

  <div class="wrap"><div id="pose-sleep" class="stage" style="opacity:0.92">
    <div class="glow"></div>
    <div class="body"></div>
    <div class="face">
      <div class="eyes"><div class="eye sleep"></div><div class="eye sleep"></div></div>
    </div>
  </div></div>

</body>
</html>
